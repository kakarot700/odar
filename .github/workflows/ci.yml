name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

permissions:
  contents: read

# Every check in this workflow is MANDATORY unless its name is explicitly
# prefixed "[informational]".  No `|| true` on mandatory gates: failures must
# be fixed, not bypassed.

jobs:
  static:
    name: Lint / Typecheck / Secret scan (mandatory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev toolchain from lockfile
        run: |
          python3 -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install -r requirements/dev.lock.txt
      - name: Ruff lint
        run: python3 -m ruff check odar/ tests/ run_research.py benchmarks/
      - name: Ruff formatting
        run: python3 -m ruff format --check odar/ tests/ run_research.py benchmarks/
      - name: Mypy (gated modules - errors fail the build)
        run: |
          python3 -m mypy --ignore-missing-imports --no-strict-optional \
            odar/budget.py odar/trust.py odar/url_safety.py odar/retry.py \
            odar/evidence.py odar/jobstore.py odar/telemetry.py odar/health.py
      - name: Secret scan (whole repository)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          patterns = {
              "Anthropic key": re.compile(r"sk-ant-[A-Za-z0-9_-]{40,}"),
              "OpenAI key": re.compile(r"sk-(?:proj-|svcacct-)?[A-Za-z0-9_-]{32,}"),
              "AWS access key": re.compile(r"AKIA[0-9A-Z]{16}"),
              "GitHub token": re.compile(r"(?:gh[pousr]_[A-Za-z0-9_]{30,}|github_pat_[A-Za-z0-9_]{50,})"),
              "Slack token": re.compile(r"xox[baprs]-[0-9A-Za-z-]{12,}"),
              "Google API key": re.compile(r"AIza[0-9A-Za-z_-]{35}"),
              "private key block": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH |DSA |ENCRYPTED )?PRIVATE KEY-----"),
              "bearer credential": re.compile(r"(?i)\bbearer\s+[A-Za-z0-9._~+/-]{24,}"),
              "credential assignment": re.compile(
                  r'''(?i)\b(?:api[_-]?key|access[_-]?token|client[_-]?secret|password|aws_secret_access_key)\s*[:=]\s*["']([^\r\n"']{24,})["']'''
              ),
              "URL user-info": re.compile(r"https?://[^/\s:@]+:[^/\s@]{8,}@"),
          }
          findings = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              name = path.name.lower()
              if (name == ".env" or name.startswith(".env.")) and name != ".env.example":
                  findings.append((path, "environment file"))
                  continue
              try:
                  data = path.read_bytes()
              except OSError:
                  continue
              if b"\0" in data[:4096]:
                  continue
              text = data.decode("utf-8", errors="replace")
              for label, pattern in patterns.items():
                  if pattern.search(text):
                      findings.append((path, label))
          for path, label in findings:
              print(f"::error file={path}::potential {label} detected (value suppressed)")
          if findings:
              sys.exit(1)
          print("secret scan clean")
          PY
      - name: Build Python wheel
        run: python3 -m pip wheel . --no-deps --no-build-isolation --wheel-dir /tmp/odar-wheel

  dependency-audit:
    name: pip-audit against locked production deps (mandatory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 -m pip install pip_audit==2.10.1
      - name: Audit the production lockfile
        run: python3 -m pip_audit -r requirements/prod.lock.txt

  unit-security-adversarial:
    name: Offline deterministic suite (unit + security + adversarial + offline e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install CPU torch + development/test lock
        run: |
          python3 -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install -r requirements/dev.lock.txt
          python3 -m pip install -e . --no-deps
      - name: Default test command (offline, deterministic)
        run: python3 -m pytest tests/ -q
      - name: Run offline benchmark corpus
        run: python3 benchmarks/runner.py

  integration:
    name: Integration (multi-turn mock LLM server; live NLI opt-in)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install CPU torch + development/test lock
        run: |
          python3 -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install -r requirements/dev.lock.txt
          python3 -m pip install -e . --no-deps
      - name: Integration tests
        run: python3 -m pytest tests/ -q -m integration

  e2e-cli:
    name: E2E CLI lifecycle (live network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install CPU torch + development/test lock
        run: |
          python3 -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install -r requirements/dev.lock.txt
          python3 -m pip install -e . --no-deps
      - name: E2E tests
        run: python3 -m pytest tests/ -q -m e2e

  sandbox-root-mode:
    name: Sandbox regression as root (privilege-drop paths)
    runs-on: ubuntu-latest
    container:
      image: python:3.13-slim
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Install locked deps
        run: |
          python3 -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install -r requirements/dev.lock.txt
          python3 -m pip install -e . --no-deps
      - name: Sandbox suite as root
        run: python3 -m pytest tests/security/test_sandbox_hardened.py tests/security/test_sandbox_privileges.py -q

  build-image:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Dockerfile
        run: docker build -t odar-engine:ci .

  smoke:
    name: Smoke (health command)
    runs-on: ubuntu-latest
    needs: unit-security-adversarial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python3 -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install -r requirements/prod.lock.txt
          python3 -m pip install -e . --no-deps
      - run: python3 run_research.py health --db /tmp/smoke.db
