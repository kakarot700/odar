<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#4f86bb">
<meta name="referrer" content="no-referrer">
<meta name="description" content="ODAR answers your questions with sources and checks every citation against the page it cites.">
<title>ODAR · answers you can check</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231d1b18'/%3E%3Ctext x='16' y='22.5' font-family='system-ui,sans-serif' font-size='18' font-weight='800' text-anchor='middle' fill='%23f7f4ef'%3EO%3C/text%3E%3C/svg%3E">
<link rel="preload" href="/static/fonts/InterVariable-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/style.css">
<script>
/* First paint: guess the sky's tone from the clock (sky.js refines it) so text never flashes. */
try{var d=document.documentElement,p=localStorage.getItem("odar.theme")||"system",f=new URLSearchParams(location.search).get("sky")||sessionStorage.getItem("odar.sky")||"",h=new Date().getHours()+new Date().getMinutes()/60;
var dark=f?/dusk|night/.test(f):(h<5.6||h>=18.6);d.dataset.theme=p;d.dataset.tone=p==="light"||p==="dark"?p:(dark?"dark":"light");}catch(e){}
</script>
</head>
<body>
<canvas id="sky" class="sky" aria-hidden="true"></canvas>
<a class="skip" href="#view">Skip to content</a>
<header class="topbar">
  <button class="glass-btn round" id="btn-search" title="Search (Ctrl K)" aria-label="Search"><span class="s-icon"></span></button>
  <nav class="seg-tabs" role="tablist" aria-label="Sections">
    <span class="seg-ind" aria-hidden="true"></span>
    <a role="tab" id="tab-home" data-tab="home" href="/home" data-nav>Home</a>
    <a role="tab" id="tab-chat" data-tab="chat" href="/" data-nav>Chat</a>
    <a role="tab" id="tab-projects" data-tab="projects" href="/projects" data-nav>Projects</a>
  </nav>
  <div class="tb-right">
    <button class="avatar-btn" id="btn-profile" aria-label="Settings" title="Settings"></button>
  </div>
</header>

<aside id="rail" class="rail hidden" aria-label="Home"></aside>
<main id="view" class="view" tabindex="-1"></main>

<div id="composer-wrap" class="composer-wrap hidden">
  <div class="comp-inner">
    <div id="comp-chips" class="comp-chips"></div>
    <form id="composer" class="composer" autocomplete="off">
      <input type="file" id="file" accept=".pdf,.docx,.txt,.md" hidden>
      <textarea id="q" rows="1" maxlength="60000" placeholder="Ask ODAR" aria-label="Message"></textarea>
      <div class="comp-btns">
        <button type="button" class="comp-ic" id="btn-plus" data-menu aria-haspopup="menu" aria-label="Attach and modes"></button>
        <span class="morph"><button type="button" class="comp-ic gone" id="btn-mic" aria-label="Dictate"></button><button type="submit" class="send gone" id="btn-send" aria-label="Send"></button></span>
      </div>
    </form>
  </div>
</div>

<div id="menu" class="menu hidden" role="menu"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
  <div class="sheet-scrim"></div>
  <div class="sheet-panel" tabindex="-1"><div class="sheet-grab" aria-hidden="true"></div><div class="sheet-body"></div></div>
</div>
<div id="search" class="search-ov hidden" role="dialog" aria-label="Search">
  <div class="search-panel">
    <div class="search-box"><span class="s-ic" id="search-ic"></span><input id="search-q" placeholder="Search chats, projects and reports" aria-label="Search"><button class="glass-btn round sm" id="search-x" aria-label="Close search"></button></div>
    <div id="search-res"></div>
  </div>
</div>
<noscript><p style="padding:24px">ODAR needs JavaScript.</p></noscript>
<script type="module" src="/static/app.js"></script>
</body>
</html>
