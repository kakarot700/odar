<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f4ef">
<meta name="referrer" content="no-referrer">
<meta name="description" content="ODAR answers your questions with sources and checks every citation against the page it cites.">
<title>ODAR · answers you can check</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231d1b18'/%3E%3Ctext x='16' y='22.5' font-family='system-ui,sans-serif' font-size='18' font-weight='800' text-anchor='middle' fill='%23f7f4ef'%3EO%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
<script>try{var th=localStorage.getItem("odar.theme")||"system";document.documentElement.dataset.theme=th;}catch(e){}</script>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<header class="topbar">
  <div class="tb-row">
    <button class="icon-btn" id="btn-home" aria-label="Home"></button>
    <a class="brand" id="brand" href="/" data-nav aria-label="ODAR chat">ODAR</a>
    <div class="tb-right">
      <button class="icon-btn" id="btn-search" aria-label="Search" title="Search (Ctrl K)"></button>
      <button class="icon-btn" id="btn-profile" aria-label="Profile" title="Profile &amp; settings"></button>
    </div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <a role="tab" id="tab-chat" data-tab="chat" href="/" data-nav>Chat</a>
    <a role="tab" id="tab-projects" data-tab="projects" href="/projects" data-nav>Projects</a>
  </nav>
</header>

<main id="view" class="view" tabindex="-1"></main>

<div id="composer-wrap" class="composer-wrap hidden">
  <div class="comp-inner">
    <div id="comp-chips" class="comp-chips"></div>
    <form id="composer" class="composer" autocomplete="off">
      <button type="button" class="icon-btn sm attach" id="btn-attach" aria-label="Attach a file" title="Attach PDF, DOCX, TXT or MD"></button>
      <input type="file" id="file" accept=".pdf,.docx,.txt,.md" hidden>
      <textarea id="q" rows="1" maxlength="60000" placeholder="Message ODAR" aria-label="Message"></textarea>
      <button type="submit" class="send" id="btn-send" aria-label="Send"></button>
    </form>
  </div>
</div>

<div id="menu" class="menu hidden" role="menu"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
  <div class="sheet-scrim"></div>
  <div class="sheet-panel" tabindex="-1"><div class="sheet-grab" aria-hidden="true"></div><div class="sheet-body"></div></div>
</div>
<div id="search" class="search-ov hidden" role="dialog" aria-label="Search">
  <div class="search-panel">
    <div class="search-box"><span class="s-ic" id="search-ic"></span><input id="search-q" placeholder="Search threads, messages and reports" aria-label="Search"><button class="icon-btn sm" id="search-x" aria-label="Close search"></button></div>
    <div id="search-res"></div>
  </div>
</div>
<noscript><p style="padding:24px">ODAR needs JavaScript.</p></noscript>
<script type="module" src="/static/app.js"></script>
</body>
</html>
